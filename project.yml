# XcodeGen spec for the *full* project: app + widget extension + unit tests.
#
#   brew install xcodegen && xcodegen generate
#
# generates MySHSMUAll.xcodeproj, which is a superset of the checked-in
# MySHSMU.xcodeproj (that one is hand-written and contains the app target
# only, so it opens in Xcode with no extra tooling). The different project
# name keeps the two from overwriting each other.
name: MySHSMUAll
options:
  bundleIdPrefix: xyz.reqwey
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "3.0"
    CURRENT_PROJECT_VERSION: "30"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    # Xcode's own app template sets this for Debug; XcodeGen does not, and
    # without it `@testable import MySHSMU` fails to compile.
    Debug:
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES

targets:
  MySHSMU:
    type: application
    platform: iOS
    sources:
      - path: MySHSMU
    dependencies:
      - target: MySHSMUWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.reqwey.myshsmu
        PRODUCT_NAME: MySHSMU
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 酱紫办
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES

  MySHSMUWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MySHSMUWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.reqwey.myshsmu.widget
        PRODUCT_NAME: MySHSMUWidget
        INFOPLIST_FILE: MySHSMUWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  MySHSMUTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MySHSMUTests
    dependencies:
      - target: MySHSMU
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.reqwey.myshsmu.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  MySHSMU:
    build:
      targets:
        MySHSMU: all
        MySHSMUWidget: all
        MySHSMUTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MySHSMUTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
