name: iOS build

# Building an iOS app requires macOS and Xcode; nothing else can produce a
# runnable .app. This workflow exists so the project can be compiled, its tests
# run, and its UI captured on GitHub's macOS runners -- without owning a Mac.
#
# If this file lives at the repository root rather than inside `ios/`, set
# `defaults.run.working-directory: ios` below and point the paths at `ios/…`.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: .

env:
  BUNDLE_ID: xyz.reqwey.myshsmu
  DERIVED_DATA: build/dd

jobs:
  build:
    # macos-15 ships Xcode 16.
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          xcodebuild -version
          echo "--- available simulators ---"
          xcrun simctl list devices available | grep -i iphone | head -10

      - name: Pick a booted-capable iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              if 'iOS' not in runtime:
                  continue
              for device in devices[runtime]:
                  if device['name'].startswith('iPhone'):
                      print(device['udid'])
                      raise SystemExit
          raise SystemExit('no iPhone simulator found')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      # Note on `-quiet`: it suppresses the thousands of CompileSwift lines but
      # still prints every error and warning. The exit status is read directly
      # rather than through a pipe -- piping into `tail` would replace
      # xcodebuild's status with tail's and report failures as successes.
      #
      # 1. The checked-in, dependency-free project must build on its own.
      - name: Build the app (checked-in project)
        run: |
          set +e
          xcodebuild build -quiet \
            -project MySHSMU.xcodeproj \
            -scheme MySHSMU \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/dd-app \
            CODE_SIGNING_ALLOWED=NO > /tmp/build-app.log 2>&1
          status=$?
          echo "xcodebuild exit status: $status"
          echo "=== errors and warnings ==="
          grep -E "(error|warning):" /tmp/build-app.log | sed 's|/Users/runner/work/[^ ]*/||' | sort -u | head -120
          echo "=== last lines ==="
          tail -20 /tmp/build-app.log
          exit $status

      - name: Upload the app build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-app-log
          path: /tmp/build-app.log
          if-no-files-found: ignore

      # 2. The generated project adds the widget extension and the test target.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the full project
        run: xcodegen generate

      - name: Build the full project (app + widget)
        run: |
          set +e
          xcodebuild build -quiet \
            -project MySHSMUAll.xcodeproj \
            -scheme MySHSMU \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO > /tmp/build-all.log 2>&1
          status=$?
          echo "xcodebuild exit status: $status"
          echo "=== errors and warnings ==="
          grep -E "(error|warning):" /tmp/build-all.log | sed 's|/Users/runner/work/[^ ]*/||' | sort -u | head -120
          echo "=== last lines ==="
          tail -20 /tmp/build-all.log
          exit $status

      - name: Upload the full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-all-log
          path: /tmp/build-all.log
          if-no-files-found: ignore

      # 3. Run the app in the simulator and photograph it.
      #
      # There is no account to log in with on a runner, so the app is launched
      # with `-uiDemoMode`, a DEBUG-only switch that seeds invented data and
      # short-circuits every network call. `-uiDemoTab <n>` opens one tab per
      # capture. `-uiDemoLogin` leaves the login screen alone but still blocks
      # the update check, which would otherwise raise a dialog over it.
      - name: Capture simulator screenshots
        run: |
          set -e
          UDID="${{ steps.sim.outputs.udid }}"
          APP="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/MySHSMU.app"

          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

          test -d "$APP" || { echo "app bundle not found at $APP"; exit 1; }
          xcrun simctl install "$UDID" "$APP"

          mkdir -p screenshots
          # Capture one screen at a time. The flags travel as SIMCTL_CHILD_*
          # environment variables because `simctl launch` can mistake a leading
          # `-` for one of its own options.
          capture() {
            local name="$1"; shift
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            sleep 1
            env "$@" xcrun simctl launch "$UDID" "$BUNDLE_ID" >/dev/null
            sleep 6
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
            echo "captured $name"
          }

          capture 0-login      SIMCTL_CHILD_UI_DEMO_LOGIN=1
          capture 1-curriculum SIMCTL_CHILD_UI_DEMO_MODE=1 SIMCTL_CHILD_UI_DEMO_TAB=0
          capture 2-classroom  SIMCTL_CHILD_UI_DEMO_MODE=1 SIMCTL_CHILD_UI_DEMO_TAB=1
          capture 3-scores     SIMCTL_CHILD_UI_DEMO_MODE=1 SIMCTL_CHILD_UI_DEMO_TAB=2
          capture 4-settings   SIMCTL_CHILD_UI_DEMO_MODE=1 SIMCTL_CHILD_UI_DEMO_TAB=3

          ls -la screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/*.png
          if-no-files-found: warn

      # 4. And the test suite has to pass.
      #
      # No `-quiet` here: it swallows the failure detail, leaving only
      # "TEST FAILED" and an exit code.
      - name: Run the unit tests
        run: |
          set +e
          xcodebuild test \
            -project MySHSMUAll.xcodeproj \
            -scheme MySHSMU \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO > /tmp/test.log 2>&1
          status=$?
          echo "xcodebuild exit status: $status"
          echo "=== compile errors ==="
          grep -E "(error|warning):" /tmp/test.log | sed 's|/Users/runner/work/[^ ]*/||' | sort -u | head -120
          echo "=== failures ==="
          grep -E "(XCTAssert|XCTUnwrap|Test Case .*(passed|failed)|Failing tests)" /tmp/test.log \
            | sed 's|/Users/runner/work/[^ ]*/||' | sort -u | head -120
          echo "=== summary ==="
          grep -E "Test Suite|Executed [0-9]+ test|TEST (SUCCEEDED|FAILED)" /tmp/test.log | tail -30
          exit $status

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test.log
          if-no-files-found: ignore

  # Builds an unsigned .ipa for a physical iPhone. There is no way to sign for a
  # device without either a Mac or a paid Apple Developer account, so this
  # produces the bundle and leaves signing to a sideloading tool on the user's
  # own machine (Sideloadly, AltStore) using their Apple ID.
  #
  # Built from the checked-in MySHSMU.xcodeproj on purpose: it contains only the
  # app target. App Groups -- which the widget needs -- cannot be provisioned by
  # a free Apple ID, so the widget is left out to keep signing trouble-free.
  device-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build for a physical device
        run: |
          set +e
          xcodebuild build -quiet \
            -project MySHSMU.xcodeproj \
            -scheme MySHSMU \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" > /tmp/device.log 2>&1
          status=$?
          echo "xcodebuild exit status: $status"
          grep -E "(error|warning):" /tmp/device.log | sed 's|/Users/runner/work/[^ ]*/||' | sort -u | head -80
          tail -15 /tmp/device.log
          exit $status

      - name: Package an unsigned .ipa
        run: |
          set -e
          APP="build/device/Build/Products/Release-iphoneos/MySHSMU.app"
          test -d "$APP" || { echo "no app bundle at $APP"; exit 1; }

          # An .ipa is just a zip with the bundle under Payload/.
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa && zip -qry ../MySHSMU-unsigned.ipa Payload

          echo "--- bundle ---"
          ls -la Payload/MySHSMU.app | head -20
          echo "--- ipa ---"
          ls -la ../MySHSMU-unsigned.ipa
          unzip -l ../MySHSMU-unsigned.ipa | head -15

      # Verify the bundle really targets a device and carries no simulator slice.
      - name: Sanity-check the bundle
        run: |
          set -e
          APP="build/device/Build/Products/Release-iphoneos/MySHSMU.app"
          BIN="$APP/MySHSMU"

          echo "=== architecture ==="
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q arm64 || { echo "not an arm64 device build"; exit 1; }
          if lipo -info "$BIN" | grep -q x86_64; then
            echo "contains a simulator slice -- wrong platform"; exit 1
          fi

          echo "=== minimum iOS version ==="
          otool -l "$BIN" | grep -A4 LC_BUILD_VERSION | grep -E "minos|platform" || true

          echo "=== Info.plist essentials ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"

          echo "=== unsigned (expected) ==="
          codesign -dv "$APP" 2>&1 | head -5 || echo "not signed, as intended"

      - name: Upload the unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: MySHSMU-unsigned-ipa
          path: MySHSMU-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
